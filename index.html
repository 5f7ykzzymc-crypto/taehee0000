<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>여백 — 이야기가 시작되는 곳</title>
    <link rel="stylesheet" href="style.css" />
    <script src="typewriter.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body spellcheck="false">
    <aside class="library" id="library" aria-label="작업 공간">
      <button
        class="brand"
        id="renameWorkspace"
        title="작업실 이름 변경"
        aria-label="작업실 이름 변경"
      >
        <strong id="workspaceName">여백</strong
        ><span class="brand-edit" data-icon="pen"></span>
      </button>
      <div class="work-switcher">
        <div class="work-heading">
          <label for="workSelect">작품</label>
          <button
            id="addWork"
            class="icon-button"
            aria-label="작품 추가"
            title="새 작품 추가"
          >
            <span data-icon="plus"></span>
          </button>
        </div>
        <div class="work-controls">
          <div class="work-picker">
            <select id="workSelect" aria-label="작품 선택">
              <option>내 첫 작품</option>
            </select>
          </div>
          <button
            id="editWork"
            class="icon-button"
            aria-label="작품 이름 변경"
            title="작품 이름 변경"
          >
            <span data-icon="pen"></span>
          </button>
        </div>
      </div>
      <div class="section-label">작업 공간</div>
      <nav class="categories" aria-label="카테고리">
        <button id="writingNav" class="nav active" aria-current="page">
          <span data-icon="pen"></span><span>글쓰기</span
          ><small id="total">3</small>
        </button>
        <button id="charactersNav" class="nav">
          <span data-icon="users"></span><span>캐릭터 시트</span
          ><small id="characterTotal">0</small>
        </button>
        <button id="focusNav" class="nav quiet">
          <span data-icon="focus"></span><span>집중해서 쓰기</span>
        </button>
      </nav>
      <div class="library-list">
        <div class="list-heading">
          <span id="listLabel">에피소드</span
          ><button
            id="add"
            class="icon-button"
            aria-label="에피소드 추가"
            title="새 항목 추가"
          >
            <span data-icon="plus"></span>
          </button>
        </div>
        <div id="items"></div>
      </div>
      <div class="library-bottom">
        <div class="backup-tools">
          <button
            id="backup"
            title="원고와 캐릭터, 이미지를 하나의 파일로 저장"
          >
            전체 백업</button
          ><span>·</span><button id="restore">백업 불러오기</button>
        </div>
        <button id="recoverData" class="recovery-button" hidden>
          이전 저장 자료 내려받기
        </button>
        <input
          type="file"
          id="restoreFile"
          accept=".json,application/json"
          hidden
        />
      </div>
    </aside>
    <aside class="outline" id="outline" aria-label="에피소드 장면">
      <div class="outline-header">
        에피소드 구성 <span id="sceneCount">3개의 장면</span>
      </div>
      <div id="scenes"></div>
      <button id="addScene" class="add-scene">
        <span data-icon="plus"></span> 장면 추가
      </button>
    </aside>
    <main>
      <header>
        <div class="header-left">
          <div class="panel-toggles" role="group" aria-label="작업 패널">
            <button
              id="toggleSidebar"
              class="icon-button"
              aria-label="작업 목록 접기"
              title="작업 목록 접기"
              aria-expanded="true"
              aria-controls="library"
            >
              <span data-icon="sidebar"></span>
            </button>
            <button
              id="toggleOutline"
              class="icon-button"
              aria-label="장면 구성 접기"
              title="장면 구성 접기"
              aria-expanded="true"
              aria-controls="outline"
            >
              <span data-icon="outline"></span>
            </button>
          </div>
          <div class="breadcrumb">
            <span id="categoryCrumb">글쓰기</span><b>/</b
            ><span id="crumb"></span>
          </div>
        </div>
        <div class="tools">
          <span id="saved" role="status">✓ 저장됨</span>
          <button
            id="theme"
            class="icon-button"
            title="다크 모드 전환"
            aria-label="다크 모드 전환"
            aria-pressed="false"
          >
            <span data-icon="moon"></span>
          </button>
          <button
            id="typewriter"
            title="타자기 모드 · 입력 줄을 화면 중앙에 고정"
            aria-pressed="false"
          >
            <span data-icon="typewriter"></span
            ><span class="tool-label">타자기 모드</span>
          </button>
          <button
            id="focus"
            title="집중 모드 (Esc로 종료)"
            aria-pressed="false"
          >
            <span data-icon="focus"></span
            ><span class="tool-label">집중 모드</span>
          </button>
          <button id="export" aria-label="내보내기" title="내보내기">
            <span data-icon="export"></span><span>내보내기</span>
          </button>
        </div>
      </header>
      <div class="document-scroll" id="documentScroll">
        <article id="writingView" class="writing-view">
          <div class="episode-heading">
            <span class="episode-number" aria-label="에피소드 번호"
              >EP <span id="epnum">01</span></span
            >
            <input
              id="title"
              aria-label="에피소드 제목"
              placeholder="에피소드 제목"
            />
            <button
              id="toggleEpisodeDetails"
              class="subtle-button"
              aria-controls="episodeDetails"
              aria-expanded="false"
              title="에피소드 소개 편집"
            >
              소개
            </button>
          </div>
          <div id="episodeDetails" hidden>
            <input
              id="subtitle"
              aria-label="에피소드 설명"
              placeholder="에피소드 소개"
            />
          </div>
          <div class="scene-label">
            <div>
              <span class="scene-number" id="sceneNumber">SCENE 01</span
              ><input
                id="sceneTitle"
                aria-label="장면 제목"
                placeholder="장면 제목"
              />
            </div>
            <div class="format-tools">
              <button class="format selected" data-insert="">본문</button
              ><button class="format" data-insert="\n[장면 설명]\n">지문</button
              ><button class="format" data-insert="\n인물: “대사”\n">
                대사
              </button>
            </div>
          </div>
          <div
            id="typewriterBefore"
            class="typewriter-space"
            aria-hidden="true"
          ></div>
          <textarea
            id="editor"
            aria-label="장면 글쓰기"
            spellcheck="false"
          ></textarea>
          <div
            id="sceneImages"
            class="image-gallery scene-images"
            role="group"
            aria-label="장면 이미지"
            hidden
          ></div>
          <div
            id="typewriterAfter"
            class="typewriter-space"
            aria-hidden="true"
          ></div>
        </article>
        <article id="characterView" class="character-view" hidden>
          <div class="character-page-heading">
            <h1>캐릭터 시트</h1>
            <button id="newCharacter" class="subtle-button">
              <span data-icon="plus"></span>새 캐릭터
            </button>
          </div>
          <div id="characterEmpty" class="character-empty" hidden>
            <button id="createFirstCharacter" class="primary-button">
              캐릭터 만들기
            </button>
          </div>
          <div id="characterSheet">
            <div class="character-intro">
              <input
                id="characterName"
                aria-label="캐릭터 이름"
                placeholder="캐릭터 이름"
              /><input
                id="characterTagline"
                aria-label="캐릭터 한 줄 소개"
                placeholder="한 줄 소개"
              />
            </div>
            <div class="character-layout">
              <section class="character-visual">
                <div class="field-heading">
                  <h2>비주얼 레퍼런스</h2>
                  <div class="image-actions">
                    <span id="characterImageCount">0 / 6</span
                    ><button
                      id="characterAddImage"
                      class="upload-button"
                      aria-label="캐릭터 이미지 추가"
                      title="이미지 추가 · 붙여넣기·끌어놓기 지원"
                    >
                      이미지 추가
                    </button>
                  </div>
                </div>
                <div
                  id="characterImages"
                  class="image-gallery character-gallery"
                ></div>
                <input
                  type="file"
                  id="characterImageInput"
                  accept="image/png,image/jpeg,image/webp,image/gif"
                  multiple
                  hidden
                />
              </section>
              <section class="character-profile">
                <div class="field-heading">
                  <h2>기본 정보</h2>
                </div>
                <div class="profile-grid">
                  <label>극 중 역할<input id="characterRole" /></label
                  ><label>나이 / 직업<input id="characterAge" /></label>
                </div>
                <label class="field"
                  >외모와 특징<textarea
                    id="characterAppearance"
                    rows="3"
                  ></textarea></label
                ><label class="field"
                  >성격과 말투<textarea
                    id="characterPersonality"
                    rows="3"
                  ></textarea>
                </label>
              </section>
            </div>
            <div class="character-details">
              <div class="field-heading">
                <h2>인물의 이야기</h2>
              </div>
              <div class="detail-grid">
                <label class="field"
                  >배경과 과거<textarea
                    id="characterBackstory"
                    rows="4"
                  ></textarea></label
                ><label class="field"
                  >욕망과 갈등<textarea
                    id="characterMotivation"
                    rows="4"
                  ></textarea></label
                ><label class="field"
                  >인물 관계<textarea
                    id="characterRelationships"
                    rows="4"
                  ></textarea></label
                ><label class="field"
                  >작가의 메모<textarea id="characterNotes" rows="4"></textarea>
                </label>
              </div>
            </div>
            <div class="sheet-bottom">
              <button id="deleteCharacter" class="danger-button">
                캐릭터 삭제
              </button>
            </div>
          </div>
        </article>
      </div>
      <footer>
        <div>
          <span id="count"></span><i></i><span id="reading"></span><i></i
          ><button id="fontSize" title="원고 글자 크기 변경">가 16</button
          ><span>한국어</span>
        </div>
      </footer>
    </main>
    <dialog
      id="imageDialog"
      class="image-dialog"
      aria-label="참고 이미지 크게 보기"
    >
      <button id="closeImage" class="icon-button" aria-label="이미지 닫기">
        <span data-icon="close"></span></button
      ><img id="largeImage" alt="참고 이미지 크게 보기" />
    </dialog>
    <dialog
      id="confirmDialog"
      class="confirm-dialog"
      aria-labelledby="confirmTitle"
    >
      <h2 id="confirmTitle"></h2>
      <p id="confirmMessage"></p>
      <div>
        <button id="confirmCancel" class="subtle-button">취소</button
        ><button id="confirmAction" class="primary-button">확인</button>
      </div>
    </dialog>
    <dialog
      id="workspaceDialog"
      class="workspace-dialog"
      aria-labelledby="workspaceDialogTitle"
    >
      <form id="workspaceForm">
        <div class="dialog-heading">
          <h2 id="workspaceDialogTitle">작업실 이름 바꾸기</h2>
          <button
            type="button"
            id="closeWorkspace"
            class="icon-button"
            aria-label="이름 변경 창 닫기"
          >
            <span data-icon="close"></span>
          </button>
        </div>
        <label for="workspaceNameInput"
          >작업실 이름 <small>최대 30자</small></label
        >
        <input
          id="workspaceNameInput"
          required
          maxlength="60"
          autocomplete="off"
          placeholder="나만의 작업실 이름"
        />
        <div class="workspace-dialog-actions">
          <button type="button" id="cancelWorkspace" class="subtle-button">
            취소</button
          ><button type="submit" class="primary-button">저장</button>
        </div>
      </form>
    </dialog>
    <dialog
      id="workDialog"
      class="workspace-dialog work-dialog"
      aria-labelledby="workDialogTitle"
    >
      <form id="workForm">
        <div class="dialog-heading">
          <h2 id="workDialogTitle">새 작품</h2>
          <button
            type="button"
            id="closeWork"
            class="icon-button"
            aria-label="작품 이름 창 닫기"
          >
            <span data-icon="close"></span>
          </button>
        </div>
        <label for="workNameInput">작품 이름 <small>최대 50자</small></label>
        <input
          id="workNameInput"
          required
          maxlength="100"
          autocomplete="off"
          placeholder="작품 이름"
        />
        <div class="workspace-dialog-actions">
          <button type="button" id="cancelWork" class="subtle-button">
            취소
          </button>
          <button type="submit" id="saveWork" class="primary-button">
            만들기
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status"></div>
  </body>
</html>
