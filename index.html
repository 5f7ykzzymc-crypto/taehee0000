<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>여백 — 이야기가 시작되는 곳</title><link rel="stylesheet" href="style.css"><body><aside class="library"><div class="brand">여백<span>STORY STUDIO</span></div><button id="project" class="project">◈ &nbsp; 여름의 끝에서 <span>⌄</span></button><div class="section">WORKSPACE</div><button class="nav active">▤ &nbsp; 모든 에피소드 <small id="total">3</small></button><button id="focusNav" class="nav">◉ &nbsp; 집중해서 쓰기</button><div class="section episodes-title">에피소드 <button id="add" title="에피소드 추가">＋</button></div><div id="episodes"></div><div class="library-bottom"><div class="avatar">나</div><div>나의 작업 공간<small>이 브라우저에 자동 저장됩니다</small></div></div></aside><aside class="outline"><div class="outline-header">에피소드 구성 <span id="sceneCount">3개의 장면</span></div><div id="scenes"></div><button id="addScene" class="add-scene">＋ 장면 추가</button><div class="note"><span>✧ WRITING NOTE</span><p>좋은 이야기는 작은 순간에서<br>시작됩니다. 오늘의 한 장면을<br>천천히 써 내려가 보세요.</p></div></aside><main><header><div class="breadcrumb">여름의 끝에서 <b>/</b> <span id="crumb"></span></div><div class="tools"><span id="saved">✓ 저장됨</span><button id="theme" title="테마 변경">◐</button><button id="focus" title="집중 모드 (Esc로 종료)">⛶ <span>집중 모드</span></button><button id="export">내보내기 ↗</button></div></header><div class="document-scroll"><article><div class="eyebrow">EPISODE <span id="epnum">01</span><span class="status">작성 중</span></div><input id="title" aria-label="에피소드 제목"><input id="subtitle" aria-label="에피소드 설명" placeholder="이 에피소드의 한 줄 소개를 적어보세요"><div class="divider"></div><div class="scene-label"><span id="sceneLabel"></span><div><button class="format selected" data-insert="">본문</button><button class="format" data-insert="\n[장면 설명]\n">지문</button><button class="format" data-insert="\n인물: “대사”\n">대사</button></div></div><textarea id="editor" aria-label="장면 글쓰기" spellcheck="false"></textarea><div class="end-mark">✧</div></article></div><footer><div><span class="green"></span>모든 이야기는 한 문장에서 시작됩니다.</div><div><span id="count"></span><i></i><span id="reading"></span><i></i><button id="fontSize">가 18</button><span>한국어</span></div></footer></main><div id="toast" role="status"></div><script src="app.js"></script></body></html>
